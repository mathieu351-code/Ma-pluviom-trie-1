<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Ma Pluviométrie</title></head><body>
<header><div><h1>🌧️ Ma Pluviométrie</h1><p>Mon carnet de pluie</p></div></header><main>
<section class="card"><h2>Aujourd’hui</h2><label>Date<input id="date" type="date"></label><label>Pluie mesurée (mm)<input id="rain" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0,0"></label><label>Heure du relevé<input id="time" type="time"></label><label>Observation<textarea id="note" rows="3" placeholder="Note facultative"></textarea></label><button id="save">💾 Enregistrer</button><p id="status"></p></section>
<section class="stats"><div><b id="day">0,0</b><small>mm aujourd’hui</small></div><div><b id="week">0,0</b><small>mm cette semaine</small></div><div><b id="month">0,0</b><small>mm ce mois</small></div><div><b id="year">0,0</b><small>mm cette année</small></div></section>
<section class="card"><h2>Historique</h2><div id="history"></div><button class="danger" id="clear">Effacer toutes les données</button></section>
<section class="card"><h2>Graphique des 14 derniers relevés</h2><canvas id="chart" height="220"></canvas></section>
</main><script src="app.js"></script></body></html>
